<header (click)="closePopovers()">
    <button class="menu" type="button" aria-label="Open navigation" (click)="$event.stopPropagation();openNavigation.emit()">
      <svg lucideMenu [size]="22"></svg>
    </button>
    <label class="search">
      <svg lucideSearch [size]="18"></svg>
      <input type="search" placeholder="Search quizzes, questions, users..." [value]="search()" (input)="search.set($any($event.target).value)">
    </label>
    <div class="account">
        <div class="popover">
            <button class="icon-button" type="button" aria-label="Notifications" (click)="$event.stopPropagation();notificationsOpen.set(!notificationsOpen());accountOpen.set(false)">
              <svg lucideBell [size]="21"></svg>
              <i></i>
            </button> @if(notificationsOpen()){
            <div class="panel notifications" (click)="$event.stopPropagation()"><strong>Notifications</strong>
                <p>You are all caught up.</p>
            </div>}
        </div>
        <span class="divider"></span>
        <div class="popover">
            <button class="profile" type="button" (click)="$event.stopPropagation();accountOpen.set(!accountOpen());notificationsOpen.set(false)">
              <span class="profile-copy">
                <strong>{{ user()?.fullName ?? 'Dr. Elena Vance' }}</strong>
              </span>
                <span class="avatar">
                  @if (user()?.avatar && failedAvatarUrl() !== user()?.avatar) {
                    <img [src]="user()?.avatar" [alt]="user()?.fullName ?? 'Administrator avatar'" (error)="failedAvatarUrl.set(user()?.avatar ?? '')">
                  } @else {
                    <b>{{ initials() }}</b>
                  }
                </span>
              </button>@if(accountOpen()){
            <div class="panel account-menu" (click)="$event.stopPropagation()">
                <button type="button" class="logout" (click)="signOut()">
                  <svg lucideLogOut [size]="17"></svg>
                  Log Out
                </button>
            </div>}
        </div>
    </div>
</header>
