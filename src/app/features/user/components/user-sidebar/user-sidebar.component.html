@if (open()) { <button class="backdrop" type="button" aria-label="Close navigation" (click)="closeMenu.emit()"></button> }
<aside [class.open]="open()">
    <div>
        <div class="brand-row"><a routerLink="/user/dashboard" class="brand"><svg lucideMessageSquareCheck [size]="30" aria-hidden="true"></svg><span>QuizFlow</span></a><button class="close" type="button" aria-label="Close navigation" (click)="closeMenu.emit()"><svg lucideX [size]="22" aria-hidden="true"></svg></button></div>
        <div class="nav-block"><span class="eyebrow">Study Portal</span>
            <nav aria-label="Study portal">
                <a routerLink="/user/dashboard" routerLinkActive="active" ariaCurrentWhenActive="page"><svg lucideLayoutDashboard [size]="20" aria-hidden="true"></svg>Dashboard</a>
                <a routerLink="/user/quizzes" routerLinkActive="active"><svg lucideBookOpenCheck [size]="20" aria-hidden="true"></svg>Quizzes</a>
                <a routerLink="/user/quiz-history" routerLinkActive="active"><svg lucideHistory [size]="20" aria-hidden="true"></svg>Quiz History</a>
                <a routerLink="/user/profile" routerLinkActive="active"><svg lucideUserRound [size]="20" aria-hidden="true"></svg>Profile</a>
            </nav>
        </div>
    </div>
    <div class="help">
        <div><svg lucideCircleHelp [size]="20" aria-hidden="true"></svg><strong>Need Guidance?</strong></div>
        <p>Access study tutorials or continue managing your learning progress.</p><a routerLink="/user/dashboard">Open Study Dashboard<svg lucideArrowRight [size]="16" aria-hidden="true"></svg></a></div>
</aside>
