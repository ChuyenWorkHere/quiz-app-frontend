<figure class="pulse-card" aria-labelledby="pulse-title">
  <div class="pulse-heading"><span class="brain-icon"><svg lucideBrain [size]="22" aria-hidden="true"></svg></span>
    <div>
      <h2 id="pulse-title">Active Recall Pulse</h2>
      <p>Cognitive retention efficiency</p>
    </div><span class="mastery">+48% Mastery</span>
  </div>
  <div class="metrics">
    <div>
      <div class="metric-label"><span>Active Assessment Retrievability</span><strong>92%</strong></div>
      <div class="track" role="meter" aria-label="Illustrative active assessment retrievability" aria-valuemin="0"
        aria-valuemax="100" aria-valuenow="92"><span class="active-bar"></span></div>
    </div>
    <div>
      <div class="metric-label muted"><span>Standard Passive Reading</span><strong>34%</strong></div>
      <div class="track" role="meter" aria-label="Illustrative passive reading retention" aria-valuemin="0"
        aria-valuemax="100" aria-valuenow="34"><span class="passive-bar"></span></div>
    </div>
  </div>
  <div class="study-image"><img
      src="https://lh3.googleusercontent.com/aida-public/AB6AXuCjpdcpQGB2u0RiQ2KXhqfOuG_nvXUShVr1C4q5Wc5dH9H9twGDLvkXSH8HCpUOHdv1qaPDQS3dtAAu5i7I4e12VRyOfIYrnDazUv6AjLRZlNWkJWz9Ba58cU1Bc_M0K0cPrYitotFkXJiLGky9OwiAcEppg7FmcXEwVVboyZme5LsdSYD9cu9g6KayY_JVO4abHH2gwc0YVXF9wbOsh16BGU61cY-Mb-_QtvavXZQG29vfO5pmPRK6"
      alt="A bright study workspace with a tablet and notebook" width="600" height="300" />
    <div><svg lucideCircleCheck [size]="18" aria-hidden="true"></svg><span>Built for intentional, focused mastery</span>
    </div>
  </div>
  <figcaption>Illustrative learning metrics, shown as a design example.</figcaption>
</figure>
